<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080b19">
<title>Tu Tiên Đại Đạo 4.0</title>
<style>
:root {
  --bg:#080b19;
  --panel:#121a30;
  --panel2:#1b2743;
  --gold:#ffd778;
  --purple:#b79aff;
  --green:#75e6ae;
  --red:#ff7777;
  --text:#f0f3ff;
  --muted:#9ca9c9;
  --border:#303d60;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;font-size:14px;
}
button,input,select{font:inherit}
button{
  border:1px solid var(--border);border-radius:9px;
  background:var(--panel2);color:var(--text);
  padding:10px;cursor:pointer;
}
button:active{transform:scale(.98)}
button:disabled{opacity:.45}
input{
  width:100%;padding:11px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);margin:6px 0 12px;
}
header{
  position:sticky;top:0;z-index:20;
  padding:12px;background:#0b1022;
  border-bottom:1px solid var(--border);
}
.logo{font-size:20px;font-weight:bold;color:var(--gold)}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;margin-top:10px;
}
.stat{
  background:var(--panel);padding:9px;border-radius:8px;
  border:1px solid var(--border);overflow-wrap:anywhere;
}
.stat b{color:var(--gold)}
nav{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;padding:9px;background:var(--bg);
}
nav button{padding:9px 3px;font-size:12px}
main{padding:10px;max-width:900px;margin:auto}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
h2{font-size:18px;color:var(--gold);margin:0 0 12px}
h3{font-size:15px;margin:10px 0;color:var(--purple)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.green{color:var(--green)}
.red{color:var(--red)}
.progress{
  height:10px;background:#080b19;border-radius:10px;
  overflow:hidden;margin:8px 0;
}
.progress div{height:100%;background:linear-gradient(90deg,#8666e8,#ffd778)}
.item{
  padding:10px;border:1px solid var(--border);
  border-radius:9px;margin:7px 0;background:#0e1529;
}
#login{
  max-width:420px;margin:45px auto;padding:18px;
}
#login h1{text-align:center;color:var(--gold)}
.hidden{display:none!important}
.logline{border-bottom:1px solid var(--border);padding:7px 0}
footer{text-align:center;color:var(--muted);padding:20px}
</style>
</head>
<body>

<section id="login" class="card">
  <h1>☯ Tu Tiên Đại Đạo</h1>
  <p class="muted">Phiên bản 4.0 — Tiên Giới Huyền Ảo</p>
  <h2 id="authTitle">Đăng nhập</h2>
  <label>Tên tài khoản</label>
  <input id="username" autocomplete="username" placeholder="Nhập tên tài khoản">
  <label>Mật khẩu</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
  <div class="row">
    <button onclick="login()">Đăng nhập</button>
    <button onclick="register()">Đăng ký</button>
  </div>
  <p class="muted">Dữ liệu được lưu trên thiết bị này. Đây chưa phải hệ thống tài khoản trực tuyến.</p>
  <p id="authMessage" class="red"></p>
</section>

<div id="game" class="hidden">
<header>
  <div class="logo">☯ TU TIÊN ĐẠI ĐẠO <span class="muted">4.0</span></div>
  <div class="stats">
    <div class="stat">Đạo hiệu: <b id="topName">—</b></div>
    <div class="stat">Cảnh giới: <b id="topRealm">Phàm Nhân</b></div>
    <div class="stat">Lực chiến: <b id="topPower">0</b></div>
    <div class="stat">Linh thạch: <b id="topStone">0</b></div>
  </div>
</header>

<nav id="nav"></nav>
<main id="content"></main>
<footer>Tu Tiên Đại Đạo 4.0 · Tu hành nghịch thiên · Đạo pháp trường tồn</footer>
</div>

<script>
"use strict";

const REALMS = [
 "Phàm Nhân","Luyện Khí","Trúc Cơ","Kim Đan","Nguyên Anh",
 "Hóa Thần","Luyện Hư","Hợp Thể","Đại Thừa","Độ Kiếp",
 "Chân Tiên","Kim Tiên","Đại La Kim Tiên","Tiên Quân","Tiên Đế"
];

const TABS = [
 ["home","Tổng quan"],["cultivate","Tu luyện"],
 ["battle","Chiến đấu"],["character","Nhân vật"],
 ["upgrade","Nâng cấp"],["beast","Linh thú"],
 ["quest","Nhiệm vụ"],["dungeon","Bí cảnh"],
 ["alchemy","Luyện đan"],["forge","Luyện khí"],
 ["ranking","Xếp hạng"],["journal","Nhật ký"],
 ["data","Dữ liệu"]
];

let account = "";
let db = {};
let currentTab = "home";
let autoTimer = null;

function freshPlayer(name){
 return {
  name,
  realm:0,
  realmLevel:1,
  cultivation:0,
  stones:1000,
  power:100,
  hp:100,
  maxHp:100,
  attack:20,
  defense:10,
  wins:0,
  stages:0,
  tower:0,
  beast:{level:1,exp:0},
  upgrades:{
   linhCan:{level:1,tier:1},
   theChat:{level:1,tier:1},
   congPhap:{level:1,tier:1}
  },
  inventory:{},
  materials:{},
  quests:{},
  claimed:{},
  logs:["Bắt đầu con đường tu tiên."],
  auto:false,
  potions:0,
  equipment:[],
  created:Date.now()
 };
}

let p = null;

function loadDB(){
 try{db=JSON.parse(localStorage.getItem("ttdd4_accounts")||"{}")}
 catch(e){db={}}
}

function saveDB(){
 if(!account||!p)return;
 db[account].player=p;
 try{localStorage.setItem("ttdd4_accounts",JSON.stringify(db))}
 catch(e){alert("Không thể lưu dữ liệu. Bộ nhớ thiết bị có thể đã đầy.");}
}

function register(){
 const u=document.getElementById("username").value.trim();
 const pw=document.getElementById("password").value;
 if(u.length<3||pw.length<4){
  authMessage("Tên tài khoản cần ít nhất 3 ký tự, mật khẩu ít nhất 4 ký tự.");return;
 }
 loadDB();
 if(db[u]){authMessage("Tài khoản đã tồn tại.");return;}
 db[u]={password:pw,player:freshPlayer(u)};
 account=u;p=db[u].player;
 saveDB();startGame();
}

function login(){
 const u=document.getElementById("username").value.trim();
 const pw=document.getElementById("password").value;
 loadDB();
 if(!db[u]||db[u].password!==pw){
  authMessage("Tài khoản hoặc mật khẩu không chính xác.");return;
 }
 account=u;
 p=db[u].player||freshPlayer(u);
 startGame();
}

function authMessage(s){
 document.getElementById("authMessage").textContent=s;
}

function startGame(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 buildNav();render();updateStats();
 addLog("Đăng nhập thành công.");
}

function logout(){
 stopAuto();
 saveDB();
 account="";p=null;
 document.getElementById("game").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
}

function buildNav(){
 const nav=document.getElementById("nav");
 nav.innerHTML="";
 TABS.forEach(([id,label])=>{
  const b=document.createElement("button");
  b.textContent=label;
  b.onclick=()=>{currentTab=id;render();};
  nav.appendChild(b);
 });
}

function realmName(){
 return REALMS[p.realm]+" · Tầng "+p.realmLevel;
}

function calcPower(){
 const u=p.upgrades;
 return Math.floor(
  100+p.realm*250+p.realmLevel*80+
  p.attack*3+p.defense*2+
  u.linhCan.level*150+u.linhCan.tier*25+
  u.theChat.level*180+u.theChat.tier*30+
  u.congPhap.level*220+u.congPhap.tier*35+
  p.beast.level*90
 );
}

function updateStats(){
 if(!p)return;
 p.power=calcPower();
 document.getElementById("topName").textContent=p.name;
 document.getElementById("topRealm").textContent=realmName();
 document.getElementById("topPower").textContent=p.power.toLocaleString("vi-VN");
 document.getElementById("topStone").textContent=p.stones.toLocaleString("vi-VN");
}

function addLog(text){
 if(!p)return;
 p.logs.unshift("["+new Date().toLocaleString("vi-VN")+"] "+text);
 p.logs=p.logs.slice(0,200);
}

function fmt(n){return Math.floor(n).toLocaleString("vi-VN");}

function btn(text,fn,disabled=false){
 const b=document.createElement("button");
 b.textContent=text;b.onclick=fn;b.disabled=disabled;
 return b;
}

function card(title,body){
 const el=document.createElement("section");
 el.className="card";
 const h=document.createElement("h2");h.textContent=title;
 el.appendChild(h);
 const d=document.createElement("div");
 d.innerHTML=body;el.appendChild(d);
 return el;
}

function render(){
 if(!p)return;
 updateStats();
 const root=document.getElementById("content");
 root.innerHTML="";
 const views={
  home:renderHome,
  cultivate:renderCultivate,
  battle:renderBattle,
  character:renderCharacter,
  upgrade:renderUpgrade,
  beast:renderBeast,
  quest:renderQuest,
  dungeon:renderDungeon,
  alchemy:renderAlchemy,
  forge:renderForge,
  ranking:renderRanking,
  journal:renderJournal,
  data:renderData
 };
 (views[currentTab]||renderHome)(root);
}

function renderHome(root){
 root.appendChild(card("🌌 Thông tin tu sĩ",`
  <div class="item">Đạo hiệu: <b class="gold">${escapeHTML(p.name)}</b></div>
  <div class="item">Đại cảnh giới: <b>${REALMS[p.realm]}</b></div>
  <div class="item">Tầng tu vi: <b>${p.realmLevel}/10</b></div>
  <div class="item">Tu vi: <b>${fmt(p.cultivation)}</b></div>
  <div class="item">Linh thạch: <b class="gold">${fmt(p.stones)}</b></div>
  <div class="item">Lực chiến: <b class="red">${fmt(p.power)}</b></div>
  <div class="item">Chiến thắng: ${p.wins} · Ải đã vượt: ${p.stages} · Tháp: ${p.tower}</div>
 `));
 root.appendChild(card("📜 Hành trình tu luyện",`
  <p>Hãy tích lũy tu vi, nâng cấp linh căn, thể chất, công pháp và linh thú.</p>
  <p class="muted">Mỗi đại cảnh giới có 10 tầng. Khi đạt tầng 10, bạn phải chủ động đột phá cảnh giới.</p>
 `));
 root.appendChild(btn("Tu luyện +20 tu vi",cultivate));
 root.appendChild(btn("Đột phá tầng",breakthrough));
 root.appendChild(btn("Đăng xuất",logout));
}

function renderCultivate(root){
 root.appendChild(card("🧘 Tu luyện",`
  <p>Cảnh giới: <b>${realmName()}</b></p>
  <p>Tu vi hiện tại: <b class="gold">${fmt(p.cultivation)}</b></p>
  <p>Mỗi lần tu luyện nhận 20 tu vi cơ bản.</p>
  <p class="muted">Auto tu luyện tự tăng tầng nhỏ nhưng không tự vượt đại cảnh giới.</p>
 `));
 root.appendChild(btn("Vận công tu luyện (+20)",cultivate));
 root.appendChild(btn(p.auto?"Dừng Auto tu luyện":"Bật Auto tu luyện",toggleAuto));
 root.appendChild(btn("Đột phá tầng / cảnh giới",breakthrough));
}

function cultivate(){
 p.cultivation+=20*(1+p.upgrades.congPhap.level*0.1);
 addLog("Tu luyện, tăng tu vi.");
 if(p.cultivation>=cultivationNeed()&&p.realmLevel<10){
  p.cultivation-=cultivationNeed();
  p.realmLevel++;
  p.maxHp+=10;p.hp=p.maxHp;
  addLog("Tự động đột phá tầng "+p.realmLevel+".");
 }
 saveDB();render();
}

function cultivationNeed(){
 return 100*p.realmLevel*(p.realm+1);
}

function toggleAuto(){
 p.auto=!p.auto;
 if(p.auto){
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=setInterval(()=>{
   if(!p||!p.auto){stopAuto();return;}
   cultivate();
  },3000);
  addLog("Bật Auto tu luyện.");
 }else{
  stopAuto();addLog("Tắt Auto tu luyện.");
 }
 saveDB();render();
}

function stopAuto(){
 if(autoTimer)clearInterval(autoTimer);
 autoTimer=null;
 if(p)p.auto=false;
}

function breakthrough(){
 if(p.realmLevel<10){
  if(p.cultivation<cultivationNeed()){
   alert("Tu vi chưa đủ để đột phá tầng tiếp theo.");return;
  }
  p.cultivation-=cultivationNeed();
  p.realmLevel++;
  p.maxHp+=20;p.hp=p.maxHp;
  addLog("Đột phá lên tầng "+p.realmLevel+".");
 }else{
  if(p.realm>=REALMS.length-1){
   alert("Bạn đã đạt cảnh giới tối cao hiện có!");return;
  }
  const cost=1000*(p.realm+1);
  if(p.stones<cost){
   alert("Cần "+fmt(cost)+" linh thạch để chuẩn bị độ kiếp.");return;
  }
  if(!confirm("Độ kiếp lên "+REALMS[p.realm+1]+"? Tiêu hao "+fmt(cost)+" linh thạch."))return;
  p.stones-=cost;
  const chance=Math.min(.95,.6+p.power/100000);
  if(Math.random()<chance){
   p.realm++;p.realmLevel=1;p.cultivation=0;
   p.maxHp+=100;p.hp=p.maxHp;
   p.attack+=10;p.defense+=5;
   addLog("Độ kiếp thành công! Đạt "+REALMS[p.realm]+".");
  }else{
   p.hp=Math.max(1,Math.floor(p.hp*.5));
   addLog("Độ kiếp thất bại. Cần tích lũy thêm sức mạnh.");
   alert("Độ kiếp thất bại! Hãy tăng lực chiến rồi thử lại.");
  }
 }
 saveDB();render();
}

function renderCharacter(root){
 root.appendChild(card("🧙 Nhân vật",`
  <div class="item">Tên: ${escapeHTML(p.name)}</div>
  <div class="item">Cảnh giới: ${realmName()}</div>
  <div class="item">HP: ${fmt(p.hp)}/${fmt(p.maxHp)}</div>
  <div class="item">Công kích: ${fmt(p.attack)}</div>
  <div class="item">Phòng ngự: ${fmt(p.defense)}</div>
  <div class="item">Lực chiến: ${fmt(p.power)}</div>
 `));
 root.appendChild(btn("Hồi phục HP (100 linh thạch)",()=>{
  if(p.stones<100){alert("Không đủ linh thạch.");return;}
  p.stones-=100;p.hp=p.maxHp;
  addLog("Hồi phục sinh lực.");saveDB();render();
 }));
}

function upgradeCost(key){
 const u=p.upgrades[key];
 return Math.floor(100*Math.pow(2,u.level-1)+50*(u.tier-1));
}

function renderUpgrade(root){
 root.appendChild(card("✨ Linh căn · Thể chất · Công pháp",`
  <p>Mỗi loại có 10 cấp; mỗi cấp có 10 tầng.</p>
  <p class="muted">Chi phí tăng theo cấp số nhân khi lên cấp và tăng theo tầng khi nâng tầng.</p>
 `));
 const labels={
  linhCan:"🌈 Linh căn",
  theChat:"💪 Thể chất",
  congPhap:"📖 Công pháp"
 };
 Object.keys(labels).forEach(key=>{
  const u=p.upgrades[key];
  const box=document.createElement("section");
  box.className="card";
  const title=document.createElement("h3");
  title.textContent=labels[key];
  box.appendChild(title);
  const info=document.createElement("p");
  info.textContent="Cấp "+u.level+"/10 · Tầng "+u.tier+"/10";
  box.appendChild(info);
  const cost=upgradeCost(key);
  const price=document.createElement("p");
  price.textContent="Chi phí nâng cấp: "+fmt(cost)+" linh thạch";
  box.appendChild(price);
  const b=btn("Nâng cấp",()=>upgrade(key),p.stones<cost);
  box.appendChild(b);
  root.appendChild(box);
 });
}

function upgrade(key){
 const u=p.upgrades[key];
 const cost=upgradeCost(key);
 if(p.stones<cost){alert("Không đủ linh thạch.");return;}
 p.stones-=cost;
 if(u.tier<10)u.tier++;
 else if(u.level<10){u.level++;u.tier=1;}
 else{alert("Đã đạt cấp tối đa.");p.stones+=cost;return;}
 addLog("Nâng cấp "+key+" thành công.");
 saveDB();render();
}

function renderBeast(root){
 const cost=Math.floor(100+p.beast.level*150);
 root.appendChild(card("🐉 Linh thú",`
  <div class="item">Cấp linh thú: <b>${fmt(p.beast.level)}</b></div>
  <div class="item">Lực chiến cộng thêm: <b>${fmt(p.beast.level*90)}</b></div>
  <div class="item">Chi phí nâng cấp tiếp theo: <b>${fmt(cost)}</b> linh thạch</div>
  <p class="muted">Linh thú không giới hạn cấp độ. Chi phí tăng theo cấp số cộng.</p>
 `));
 root.appendChild(btn("Nâng cấp linh thú",()=>{
  if(p.stones<cost){alert("Không đủ linh thạch.");return;}
  p.stones-=cost;p.beast.level++;
  addLog("Linh thú tăng lên cấp "+p.beast.level+".");
  saveDB();render();
 },p.stones<cost));
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function renderBattle(root){
 root.appendChild(card("⚔️ Chiến đấu",`
  <p>Lực chiến của bạn: <b>${fmt(p.power)}</b></p>
  <p>Chọn đối thủ để chiến đấu. Thắng trận nhận linh thạch và tu vi.</p>
 `));
 const enemies=[
  {name:"Yêu Lang",power:80,reward:100},
  {name:"Hắc Hùng",power:250,reward:250},
  {name:"Ma Tu",power:600,reward:500},
  {name:"Giao Long",power:1200,reward:1000},
  {name:"Tiên Thú",power:5000,reward:3000}
 ];
 enemies.forEach((e,i)=>{
  const box=document.createElement("div");box.className="item";
  const h=document.createElement("h3");h.textContent=e.name;box.appendChild(h);
  const info=document.createElement("p");
  info.textContent="Lực chiến yêu thú: "+fmt(e.power)+" · Thưởng: "+fmt(e.reward)+" linh thạch";
  box.appendChild(info);
  box.appendChild(btn("Khiêu chiến",()=>fight(e,i)));
  root.appendChild(box);
 });
}

function fight(e,index){
 const enemyPower=e.power*(1+p.stages*.05);
 if(p.hp<=0){alert("Sinh lực đã cạn. Hãy hồi phục trước.");return;}
 const win=p.power>=enemyPower*.75&&Math.random()<Math.min(.95,.65+p.power/(enemyPower*5));
 if(win){
  p.stones+=e.reward;p.cultivation+=50;
  p.wins++;p.stages++;
  p.hp=Math.min(p.maxHp,p.hp+Math.floor(p.maxHp*.1));
  addLog("Đánh bại "+e.name+", nhận "+e.reward+" linh thạch.");
  alert("Chiến thắng! Nhận "+e.reward+" linh thạch và 50 tu vi.");
 }else{
  const damage=Math.max(5,Math.floor(enemyPower*.1-p.defense*.2));
  p.hp=Math.max(0,p.hp-damage);
  addLog("Thất bại trước "+e.name+", mất "+damage+" HP.");
  alert("Thất bại! Mất "+damage+" HP.");
 }
 saveDB();render();
}

function renderQuest(root){
 const quests=[
  ["q1","Tu luyện 10 lần",10,()=>p.cultivation>=200],
  ["q2","Đạt tầng tu vi thứ 5",20,()=>p.realmLevel>=5],
  ["q3","Chiến thắng 3 trận",100,()=>p.wins>=3],
  ["q4","Nâng linh thú lên cấp 5",150,()=>p.beast.level>=5],
  ["q5","Tích lũy 1000 linh thạch",200,()=>p.stones>=1000],
  ["q6","Vượt ải 10 lần",250,()=>p.stages>=10],
  ["q7","Nâng cấp linh căn",100,()=>p.upgrades.linhCan.level>1||p.upgrades.linhCan.tier>1],
  ["q8","Nâng cấp thể chất",100,()=>p.upgrades.theChat.level>1||p.upgrades.theChat.tier>1],
  ["q9","Nâng cấp công pháp",100,()=>p.upgrades.congPhap.level>1||p.upgrades.congPhap.tier>1],
  ["q10","Đạt lực chiến 10000",500,()=>p.power>=10000]
 ];
 quests.forEach(([id,name,reward,done])=>{
  const box=document.createElement("div");box.className="item";
  const h=document.createElement("h3");h.textContent=name;box.appendChild(h);
  const s=document.createElement("p");s.textContent="Thưởng: "+reward+" linh thạch";box.appendChild(s);
  if(p.claimed[id])box.appendChild(document.createTextNode("Đã nhận thưởng"));
  else if(done())box.appendChild(btn("Nhận thưởng",()=>{
   p.stones+=reward;p.claimed[id]=true;
   addLog("Hoàn thành nhiệm vụ: "+name);
   saveDB();render();
  }));
  else box.appendChild(document.createTextNode("Chưa hoàn thành"));
  root.appendChild(box);
 });
}

function renderDungeon(root){
 const dungeons=[
  ["Rừng Yêu Thú",100,100],
  ["Hang Động U Minh",500,300],
  ["Di Tích Cổ Tiên",1500,700],
  ["Thâm Uyên Ma Giới",4000,1500],
  ["Thiên Hà Bí Cảnh",10000,4000],
  ["Cửu Trọng Tiên Cung",25000,10000],
  ["Long Tộc Thánh Địa",50000,20000],
  ["Vạn Kiếm Mộ",100000,40000],
  ["Hỗn Độn Chi Hải",250000,100000],
  ["Vô Thượng Tiên Vực",500000,250000],
  ["Thái Cổ Thần Khư",1000000,500000],
  ["Đại Đạo Cấm Khu",5000000,2000000]
 ];
 dungeons.forEach(([name,power,reward],i)=>{
  const box=document.createElement("div");box.className="item";
  const h=document.createElement("h3");h.textContent=name;box.appendChild(h);
  const s=document.createElement("p");
  s.textContent="Lực chiến yêu cầu: "+fmt(power)+" · Phần thưởng: "+fmt(reward)+" linh thạch";
  box.appendChild(s);
  box.appendChild(btn("Khám phá",()=>{
   if(p.power<power){alert("Lực chiến chưa đủ!");return;}
   if(p.claimed["dungeon"+i]){alert("Bí cảnh này đã hoàn thành.");return;}
   p.claimed["dungeon"+i]=true;p.stones+=reward;p.cultivation+=100;
   addLog("Khám phá bí cảnh "+name+".");
   saveDB();render();
  },p.power<power||!!p.claimed["dungeon"+i]));
  root.appendChild(box);
 });
}

function renderAlchemy(root){
 root.appendChild(card("🧪 Luyện đan",`
  <p>Đan dược phục hồi sinh lực và hỗ trợ tu luyện.</p>
  <p>Nguyên liệu hiện có: ${fmt(p.materials.herb||0)} linh thảo.</p>
  <p>Đan dược hiện có: ${fmt(p.potions)}</p>
  <p>Giá chế tạo: 50 linh thạch và 3 linh thảo.</p>
 `));
 root.appendChild(btn("Mua 3 linh thảo (30 linh thạch)",()=>{
  if(p.stones<30){alert("Không đủ linh thạch.");return;}
  p.stones-=30;p.materials.herb=(p.materials.herb||0)+3;
  saveDB();render();
 }));
 root.appendChild(btn("Luyện 1 Hồi Xuân Đan",()=>{
  if(p.stones<50||(p.materials.herb||0)<3){
   alert("Cần 50 linh thạch và 3 linh thảo.");return;
  }
  p.stones-=50;p.materials.herb-=3;p.potions++;
  addLog("Luyện thành 1 Hồi Xuân Đan.");
  saveDB();render();
 }));
 root.appendChild(btn("Sử dụng Hồi Xuân Đan",()=>{
  if(p.potions<1){alert("Không có đan dược.");return;}
  p.potions--;p.hp=Math.min(p.maxHp,p.hp+Math.floor(p.maxHp*.5));
  addLog("Sử dụng Hồi Xuân Đan.");
  saveDB();render();
 },p.potions<1));
}

function renderForge(root){
 root.appendChild(card("⚒️ Luyện khí",`
  <p>Chế tạo trang bị để tăng công kích và phòng ngự.</p>
  <p>Nguyên liệu: ${fmt(p.materials.ore||0)} quặng linh thiết.</p>
  <p>Chi phí chế tạo: 200 linh thạch và 5 quặng.</p>
 `));
 root.appendChild(btn("Mua 5 quặng (100 linh thạch)",()=>{
  if(p.stones<100){alert("Không đủ linh thạch.");return;}
  p.stones-=100;p.materials.ore=(p.materials.ore||0)+5;
  saveDB();render();
 }));
 root.appendChild(btn("Luyện Linh Thiết Kiếm",()=>{
  if(p.stones<200||(p.materials.ore||0)<5){
   alert("Cần 200 linh thạch và 5 quặng.");return;
  }
  p.stones-=200;p.materials.ore-=5;
  p.attack+=25;p.defense+=10;p.equipment.push("Linh Thiết Kiếm");
  addLog("Luyện thành Linh Thiết Kiếm.");
  saveDB();render();
 }));
}

function renderRanking(root){
 const accounts=Object.entries(db).map(([name,data])=>({
  name,
  player:data.player||freshPlayer(name)
 }));
 const rankers=[
  ["Lực chiến",x=>calcPlayerPower(x.player)],
  ["Cảnh giới",x=>x.player.realm*10+x.player.realmLevel],
  ["Ải",x=>x.player.stages||0],
  ["Thông Thiên Tháp",x=>x.player.tower||0]
 ];
 rankers.forEach(([title,score])=>{
  const sorted=accounts.slice().sort((a,b)=>score(b)-score(a));
  const box=document.createElement("section");box.className="card";
  const h=document.createElement("h2");h.textContent="🏆 "+title;box.appendChild(h);
  sorted.slice(0,20).forEach((x,i)=>{
   const line=document.createElement("div");line.className="item";
   const pl=x.player;
   line.textContent=(i+1)+". "+x.name+" — "+(
    title==="Lực chiến"?fmt(score(x)):
    title==="Cảnh giới"?REALMS[pl.realm]+" · Tầng "+pl.realmLevel:
    fmt(score(x))
   );
   box.appendChild(line);
  });
  root.appendChild(box);
 });
 const note=document.createElement("p");note.className="muted";
 note.textContent="Bảng xếp hạng chỉ gồm tài khoản đã lưu trên thiết bị này; chưa phải bảng xếp hạng trực tuyến.";
 root.appendChild(note);
}

function calcPlayerPower(x){
 const u=x.upgrades||freshPlayer(x.name).upgrades;
 return Math.floor(100+x.realm*250+x.realmLevel*80+
  x.attack*3+x.defense*2+
  u.linhCan.level*150+u.linhCan.tier*25+
  u.theChat.level*180+u.theChat.tier*30+
  u.congPhap.level*220+u.congPhap.tier*35+
  x.beast.level*90);
}

function renderJournal(root){
 const box=document.createElement("section");box.className="card";
 const h=document.createElement("h2");h.textContent="📔 Nhật ký tu tiên";box.appendChild(h);
 p.logs.forEach(log=>{
  const line=document.createElement("div");line.className="logline";
  line.textContent=log;box.appendChild(line);
 });
 root.appendChild(box);
 root.appendChild(btn("Xóa nhật ký",()=>{
  if(confirm("Xóa toàn bộ nhật ký?")){
   p.logs=[];saveDB();render();
  }
 }));
}

function renderData(root){
 root.appendChild(card("💾 Quản lý dữ liệu",`
  <p>Dữ liệu nhân vật được lưu trong trình duyệt trên thiết bị hiện tại.</p>
  <p class="muted">Không chia sẻ mật khẩu tài khoản. Hãy giữ file sao lưu ở nơi an toàn.</p>
 `));
 root.appendChild(btn("Xuất dữ liệu JSON",exportData));
 const file=document.createElement("input");
 file.type="file";file.accept=".json,application/json";
 file.onchange=()=>importData(file.files[0]);
 root.appendChild(file);
 root.appendChild(btn("Lưu dữ liệu ngay",()=>{saveDB();alert("Đã lưu dữ liệu.");}));
 root.appendChild(btn("Đăng xuất",logout));
}

function exportData(){
 const blob=new Blob([JSON.stringify({account,player:p},null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="tu-tien-dai-dao-backup.json";a.click();
 URL.revokeObjectURL(url);
}

function importData(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!data.player||typeof data.player!=="object")throw Error("Sai định dạng");
   if(!confirm("Nhập dữ liệu sẽ thay thế nhân vật hiện tại. Tiếp tục?"))return;
   p=data.player;p.name=account;
   saveDB();render();alert("Nhập dữ liệu thành công.");
  }catch(e){alert("File sao lưu không hợp lệ.");}
 };
 reader.readAsText(file);
}

loadDB();
</script>
