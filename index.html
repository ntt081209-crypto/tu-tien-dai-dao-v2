<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Tiên Đại Đạo</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#100c09;
    color:#f8e8c5;
    font-family:Arial,sans-serif;
}
header{
    position:sticky;
    top:0;
    z-index:10;
    background:#1c120b;
    border-bottom:2px solid #bd8b36;
    padding:10px;
}
h1{
    text-align:center;
    color:#ffd875;
    font-size:22px;
    margin:5px 0 12px;
}
.status{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}
.stat{
    background:#332116;
    border:1px solid #8b642e;
    border-radius:8px;
    padding:8px;
    font-size:13px;
}
.stat b{
    display:block;
    color:#ffd875;
    margin-bottom:4px;
}
#power{
    color:#ff654c;
    font-weight:bold;
    font-size:17px;
}
main{
    max-width:900px;
    margin:auto;
    padding:12px;
}
nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:12px;
}
button{
    background:linear-gradient(#805323,#4c2c14);
    border:1px solid #d4a14c;
    border-radius:8px;
    padding:11px 7px;
    color:#fff0ca;
    font-weight:bold;
    cursor:pointer;
}
button:active{transform:scale(.98)}
button.active{background:#b17a29;color:#1a1006}
button.red{background:#77281d}
.card{
    background:#21160f;
    border:1px solid #805729;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
}
h2{color:#ffd875;font-size:19px;margin-top:0}
h3{color:#e6b85e}
.row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0;
}
.row button{flex:1;min-width:125px}
.metric{
    background:#120d09;
    border:1px solid #50371d;
    padding:10px;
    border-radius:8px;
    margin-bottom:7px;
}
.muted{color:#c8b18b;font-size:12px}
.progress{
    height:9px;
    background:#48311c;
    border-radius:9px;
    overflow:hidden;
    margin-top:6px;
}
.progress div{
    height:100%;
    background:linear-gradient(90deg,#d88b23,#ffe9a0);
}
.log{
    max-height:250px;
    overflow:auto;
    background:#100b08;
    border-radius:8px;
    padding:9px;
    font-size:13px;
}
.log p{
    border-bottom:1px solid #392719;
    padding-bottom:5px;
}
input{
    width:100%;
    padding:12px;
    margin:7px 0;
    background:#100b08;
    color:white;
    border:1px solid #98703a;
    border-radius:7px;
}
.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:#090604f5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.login{
    width:100%;
    max-width:400px;
    padding:20px;
    border:1px solid #d3a44e;
    border-radius:15px;
    background:#21160f;
}
.login h2{text-align:center}
.small{font-size:12px;color:#c8b18b}
@media(min-width:650px){
    .status{grid-template-columns:repeat(4,1fr)}
    nav{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<div class="overlay" id="loginScreen">
    <div class="login">
        <h2>🐉 TU TIÊN ĐẠI ĐẠO</h2>
        <p>Đăng nhập hoặc tạo nhân vật mới</p>

        <label>Tên nhân vật</label>
        <input id="username" placeholder="Nhập tên nhân vật" maxlength="24">

        <label>Mật khẩu thử nghiệm</label>
        <input id="password" type="password" placeholder="Nhập mật khẩu">

        <button style="width:100%" onclick="login()">
            ĐĂNG NHẬP / TẠO NHÂN VẬT
        </button>

        <p class="small">
            Bản thử nghiệm lưu dữ liệu trên thiết bị này.
        </p>
    </div>
</div>

<header>
    <h1>🐉 TU TIÊN ĐẠI ĐẠO</h1>

    <div class="status">
        <div class="stat">
            <b>🌌 CẢNH GIỚI</b>
            <span id="realm">Luyện Khí tầng 1</span>
        </div>

        <div class="stat">
            <b>✨ TU VI</b>
            <span id="cult">0 / 100</span>
            <div class="progress">
                <div id="cultBar" style="width:0%"></div>
            </div>
        </div>

        <div class="stat">
            <b>💎 LINH THẠCH</b>
            <span id="stones">1.000</span>
        </div>

        <div class="stat">
            <b>⚔️ LỰC CHIẾN</b>
            <span id="power">100</span>
        </div>
    </div>
</header>

<main>
    <div class="card">
        <h2 id="greeting">Xin chào tu tiên giả!</h2>
        <div class="muted" id="profile">
            Cấp độ 1 · Danh hiệu Tân Thủ
        </div>
    </div>

    <nav id="menu">
        <button class="active" onclick="showTab('cultivation',this)">🧘 Tu luyện</button>
        <button onclick="showTab('combat',this)">⚔️ Chiến đấu</button>
        <button onclick="showTab('stages',this)">♾️ Vượt ải</button>
        <button onclick="showTab('tower',this)">🗼 Leo tháp</button>
        <button onclick="showTab('character',this)">🧬 Nhân vật</button>
        <button onclick="showTab('inventory',this)">🎒 Túi đồ</button>
        <button onclick="showTab('quests',this)">📜 Nhiệm vụ</button>
        <button onclick="showTab('journal',this)">📖 Nhật ký</button>
    </nav>

    <div id="content"></div>

    <p class="small" style="text-align:center">
        Tu Tiên Đại Đạo · Bản HTML chơi thử
    </p>
</main>

<script>
const REALMS = [
"Luyện Khí","Trúc Cơ","Kim Đan","Nguyên Anh",
"Hóa Thần","Luyện Hư","Hợp Thể","Đại Thừa",
"Đại Đế","Địa Tiên","Thiên Tiên","La Thiên Thượng Tiên",
"Đại La Kim Tiên","Cửu Thiên Huyền Tiên","Tiên Quân",
"Tiên Tôn","Tiên Đế","Thánh Nhân","Đạo Tổ",
"Siêu Thoát Cảnh","Hư Vô Cảnh","Hỗn Độn Cảnh",
"Khai Thiên Cảnh","Sáng Thế Cảnh","Chưởng Đạo Cảnh",
"Vĩnh Hằng Cảnh","Bất Diệt Cảnh","Vô Thượng Cảnh",
"Chí Cao Cảnh","Thần Nguyên Cảnh","Thái Sơ Cảnh",
"Vạn Cổ Cảnh","Chung Cực Cảnh","Đạo Nguyên Chí Tôn"
];

const ROOTS = [
"Phàm Căn","Linh Căn","Địa Linh Căn","Thiên Linh Căn",
"Thánh Linh Căn","Tiên Linh Căn","Thần Linh Căn",
"Hỗn Độn Linh Căn","Đại Đạo Linh Căn","Vô Thượng Linh Căn"
];

const BODIES = [
"Phàm Thể","Linh Thể","Địa Linh Thể","Thiên Linh Thể",
"Thánh Chiến Thể","Tiên Linh Thể","Thần Ma Thể",
"Hỗn Độn Thể","Đại Đạo Thể","Hồng Mông Bất Diệt Thể"
];

function newPlayer(name){
    return {
        name:name,
        realm:0,
        stage:1,
        cult:0,
        stones:1000,
        power:100,
        attack:20,
        defense:5,
        hp:100,
        maxHp:100,
        level:1,
        xp:0,
        pills:3,
        manuals:0,
        artifacts:0,
        root:0,
        body:0,
        kills:0,
        wins:0,
        currentStage:1,
        highestStage:1,
        tower:1,
        highestTower:1,
        autoCult:false,
        autoCombat:false,
        autoStages:false,
        autoTower:false,
        lastSeen:Date.now(),
        logs:[],
        quests:{cult:0,kills:0,stages:0}
    };
}

let p=null;
let saveKey="";
let currentTab="cultivation";

function fmt(n){
    if(!Number.isFinite(n))return "∞";
    if(n<1e15)return Math.floor(n).toLocaleString("vi-VN");
    return n.toExponential(2);
}

function threshold(){
    return Math.floor(
        100*Math.pow(1.8,p.realm)*Math.pow(p.stage,1.45)
    );
}

function realmName(){
    return REALMS[p.realm] || ("Vũ Trụ "+(p.realm-REALMS.length+1));
}

function power(){
    return Math.floor(
        p.power+p.attack*3+p.defense*2+p.maxHp*.2+
        p.level*25+p.manuals*100+p.artifacts*250
    );
}

function rootMultiplier(){
    return 1+p.root*.5;
}

function offlineRate(){
    return Math.max(1,Math.floor(
        rootMultiplier()*(p.realm+1)*(1+p.manuals*.05)
    ));
}

function addLog(text){
    p.logs.unshift(new Date().toLocaleString("vi-VN")+" — "+text);
    p.logs=p.logs.slice(0,100);
}

function save(){
    if(!p||!saveKey)return;
    p.lastSeen=Date.now();
    try{
        localStorage.setItem(saveKey,JSON.stringify(p));
    }catch(e){}
}

function login(){
    const name=document.getElementById("username").value.trim();
    const pass=document.getElementById("password").value;

    if(!name||!pass){
        alert("Hãy nhập tên nhân vật và mật khẩu.");
        return;
    }

    // Mật khẩu chỉ dùng để kiểm tra nhập liệu trong bản thử nghiệm.
    // Đây chưa phải hệ thống xác thực an toàn.
    saveKey="tutien_"+name.toLowerCase().replace(/[^a-z0-9_-]/g,"_");

    const saved=localStorage.getItem(saveKey);

    if(saved){
        try{
            p={...newPlayer(name),...JSON.parse(saved)};
            p.name=name;
            addLog("Đăng nhập trở lại.");
        }catch(e){
            p=newPlayer(name);
            addLog("Tạo nhân vật mới.");
        }
    }else{
        p=newPlayer(name);
        addLog("Bắt đầu con đường tu tiên!");
    }

    const offline=Math.max(0,Date.now()-(p.lastSeen||Date.now()));
    const minutes=Math.floor(offline/60000);

    if(minutes>0){
        const gain=minutes*offlineRate();
        p.cult+=gain;
        addLog("Ngoại tuyến "+fmt(minutes)+" phút, nhận "+fmt(gain)+" tu vi.");
        processBreakthroughs();
    }

    document.getElementById("loginScreen").style.display="none";
    save();
    render();
}

function updateStatus(){
    document.getElementById("realm").textContent=
        realmName()+" tầng "+p.stage;

    document.getElementById("cult").textContent=
        fmt(p.cult)+" / "+fmt(threshold());

    document.getElementById("cultBar").style.width=
        Math.min(100,p.cult/threshold()*100)+"%";

    document.getElementById("stones").textContent=fmt(p.stones);
    document.getElementById("power").textContent=fmt(power());

    document.getElementById("greeting").textContent=
        "🐉 Xin chào, "+p.name+"!";

    document.getElementById("profile").textContent=
        "Cấp độ "+p.level+" · Linh Căn "+ROOTS[p.root];
}

function showTab(tab,button){
    currentTab=tab;
    document.querySelectorAll("#menu button").forEach(b=>{
        b.classList.remove("active");
    });
    if(button)button.classList.add("active");
    render();
}

function card(title,body){
    return `<section class="card"><h2>${title}</h2>${body}</section>`;
}

function metric(label,value){
    return `<div class="metric"><span class="muted">${label}</span><br><b>${value}</b></div>`;
}

function render(){
    if(!p)return;
    updateStatus();

    let html="";

    if(currentTab==="cultivation"){
        html=card("🧘 Tu luyện",`
            ${metric("Tốc độ ngoại tuyến",fmt(offlineRate())+" tu vi/phút")}
            ${metric("Tu vi cần cho tầng tiếp theo",fmt(threshold()))}

            <div class="row">
                <button onclick="cultivate()">Tu luyện +20</button>
                <button onclick="toggleAuto('autoCult')">
                    ${p.autoCult?"Tắt tự tu luyện":"Bật tự tu luyện"}
                </button>
                <button onclick="manualMinorBreakthrough()">Đột phá tầng</button>
            </div>

            <div class="row">
                <button onclick="majorBreakthrough()">🌩️ Đột phá đại cảnh giới</button>
                <button onclick="usePill()">💊 Dùng Tụ Khí Đan (${p.pills})</button>
            </div>

            <p class="small">
                Tầng nhỏ tự động đột phá khi đủ tu vi.
                Đạt tầng 10 phải tự đột phá đại cảnh giới.
            </p>
        `);
    }

    else if(currentTab==="combat"){
        html=card("⚔️ Chiến đấu",`
            ${metric("Sinh lực",fmt(p.hp)+" / "+fmt(p.maxHp))}
            ${metric("Công kích",fmt(p.attack))}
            ${metric("Phòng thủ",fmt(p.defense))}
            ${metric("Lực chiến",fmt(power()))}

            <div class="row">
                <button onclick="fight()">⚔️ Đánh một trận</button>
                <button onclick="toggleAuto('autoCombat')">
                    ${p.autoCombat?"Tắt AUTO chiến đấu":"Bật AUTO chiến đấu"}
                </button>
            </div>

            <p class="small">
                Chiến đấu hiện được mô phỏng trên thiết bị.
                Chưa có PVP trực tuyến.
            </p>
        `);
    }

    else if(currentTab==="stages"){
        html=card("♾️ Vượt ải vô hạn",`
            ${metric("Ải hiện tại",fmt(p.currentStage))}
            ${metric("Ải cao nhất",fmt(p.highestStage))}

            <div class="row">
                <button onclick="stageFight()">Khiêu chiến ải</button>
                <button onclick="toggleAuto('autoStages')">
                    ${p.autoStages?"Dừng AUTO ải":"Bật AUTO vượt ải"}
                </button>
            </div>
            <p class="small">Boss xuất hiện mỗi 10 ải, Boss đặc biệt mỗi 100 ải.</p>
        `);
    }

    else if(currentTab==="tower"){
        html=card("🗼 Thông Thiên Tháp",`
            ${metric("Tầng kế tiếp",fmt(p.tower))}
            ${metric("Tầng cao nhất",fmt(p.highestTower))}

            <div class="row">
                <button onclick="towerFight()">Khiêu chiến tầng</button>
                <button onclick="toggleAuto('autoTower')">
                    ${p.autoTower?"Dừng AUTO tháp":"Bật AUTO leo tháp"}
                </button>
            </div>
        `);
    }

    else if(currentTab==="character"){
        html=card("🧬 Nhân vật",`
            ${metric("Cảnh giới",realmName()+" tầng "+p.stage)}
            ${metric("Lực chiến",fmt(power()))}
            ${metric("Công kích",fmt(p.attack))}
            ${metric("Phòng thủ",fmt(p.defense))}
            ${metric("Linh Căn",ROOTS[p.root])}
            ${metric("Thể Chất",BODIES[p.body])}
            ${metric("Cấp độ",p.level)}

            <div class="row">
                <button onclick="upgradeRoot()">Nâng Linh Căn (500)</button>
                <button onclick="upgradeBody()">Rèn Thể Chất (500)</button>
                <button onclick="upgradeManual()">Nâng Công Pháp (300)</button>
            </div>
        `);
    }

    else if(currentTab==="inventory"){
        html=card("🎒 Túi đồ",`
            ${metric("Linh Thạch",fmt(p.stones))}
            ${metric("Tụ Khí Đan",p.pills)}
            ${metric("Bí kíp",p.manuals)}
            ${metric("Pháp Bảo",p.artifacts)}

            <div class="row">
                <button onclick="buyPills()">Mua 3 đan dược (100)</button>
                <button onclick="buyArtifact()">Rèn pháp bảo (1.000)</button>
                <button onclick="buyManual()">Mua bí kíp (500)</button>
            </div>
        `);
    }

    else if(currentTab==="quests"){
        html=card("📜 Nhiệm vụ",`
            ${metric("Kẻ địch đã đánh bại",p.kills)}
            ${metric("Trận thắng",p.wins)}
            ${metric("Ải cao nhất",p.highestStage)}
            <hr>
            <p>Tu luyện 20 lần: ${Math.min(20,p.quests.cult)}/20</p>
            <p>Đánh bại 10 kẻ địch: ${Math.min(10,p.quests.kills)}/10</p>
            <p>Vượt ải 5 lần: ${Math.min(5,p.quests.stages)}/5</p>
            <button onclick="claimQuest()">Nhận thưởng nhiệm vụ</button>
        `);
    }

    else if(currentTab==="journal"){
        html=card("📖 Nhật ký tu tiên",`
            <div class="log">
                ${p.logs.map(x=>"<p>"+escapeHTML(x)+"</p>").join("")}
            </div>
            <div class="row">
                <button onclick="exportSave()">Xuất bản lưu</button>
                <button class="red" onclick="resetGame()">Xóa tiến trình</button>
            </div>
        `);
    }

    document.getElementById("content").innerHTML=html;
    updateStatus();
}

function escapeHTML(text){
    return String(text).replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

function cultivate(){
    p.cult+=20;
    p.quests.cult++;
    addLog("Tu luyện nhận +20 tu vi.");
    processBreakthroughs();
    save();
    render();
}

function processBreakthroughs(){
    let loops=0;

    while(p.stage<10 && p.cult>=threshold() && loops<1000){
        p.cult-=threshold();
        p.stage++;

        p.power=Math.floor(p.power*1.12+10);
        p.attack=Math.floor(p.attack*1.1+3);
        p.defense=Math.floor(p.defense*1.08+1);
        p.maxHp=Math.floor(p.maxHp*1.1+10);
        p.hp=p.maxHp;
        p.xp+=20;

        addLog("Đột phá "+realmName()+" tầng "+p.stage+"!");
        loops++;
    }

    if(p.stage===10 && p.cult>=threshold()){
        addLog("Đạt đỉnh đại cảnh giới. Hãy tự đột phá!");
    }
}

function manualMinorBreakthrough(){
    if(p.stage>=10){
        alert("Đã đạt tầng 10. Hãy đột phá đại cảnh giới.");
        return;
    }

    if(p.cult<threshold()){
        alert("Chưa đủ tu vi!");
        return;
    }

    processBreakthroughs();
    save();
    render();
}

function majorBreakthrough(){
    if(p.stage<10){
        alert("Cần đạt tầng 10 trước.");
        return;
    }

    if(p.cult<threshold()){
        alert("Chưa đủ tu vi để đột phá đại cảnh giới.");
        return;
    }

    p.cult-=threshold();
    p.realm++;
    p.stage=1;

    p.power=Math.floor(p.power*2.5+100);
    p.attack=Math.floor(p.attack*2.2+50);
    p.defense=Math.floor(p.defense*2+25);
    p.maxHp=Math.floor(p.maxHp*2.4+100);
    p.hp=p.maxHp;

    addLog("Đột phá đại cảnh giới thành công: "+realmName()+"!");
    save();
    render();
}

function levelUp(){
    if(p.xp>=p.level*100){
        p.xp-=p.level*100;
        p.level++;
        p.maxHp+=20;
        p.attack+=5;
        p.defense+=2;
        p.hp=p.maxHp;
        p.stones+=100;
        addLog("Lên cấp "+p.level+", nhận 100 Linh Thạch.");
    }
}

function usePill(){
    if(p.pills<=0){
        alert("Hết Tụ Khí Đan!");
        return;
    }
    p.pills--;
    p.cult+=Math.max(100,threshold()*.25);
    addLog("Sử dụng Tụ Khí Đan.");
    processBreakthroughs();
    save();
    render();
}

function enemyPower(n){
    return Math.floor(
        (100+p.realm*120+p.stage*30+p.level*20)*
        Math.pow(1.12,Math.min(1000,Math.max(0,n-1)))
    );
}

function battle(enemy,enemyP,kind){
    const myPower=power();
    const chance=Math.max(.08,Math.min(.92,myPower/(myPower+enemyP)*1.4));

    if(Math.random()<chance){
        const reward=Math.floor(50+Math.min(enemyP,1e12)*.08);

        p.stones+=reward;
        p.cult+=Math.floor(15+Math.min(enemyP,1e12)*.03);
        p.kills++;
        p.wins++;
        p.quests.kills++;
        p.xp+=Math.max(10,Math.floor(enemyP*.1));
        p.hp=Math.min(p.maxHp,p.hp+Math.floor(p.maxHp*.15));

        addLog("Chiến thắng "+enemy+", nhận "+fmt(reward)+" Linh Thạch!");

        if(kind==="stage"){
            p.highestStage=Math.max(p.highestStage,p.currentStage);
            p.currentStage++;
            p.quests.stages++;
        }

        if(kind==="tower"){
            p.highestTower=Math.max(p.highestTower,p.tower);
            p.tower++;
        }

        levelUp();
        processBreakthroughs();

    }else{
        p.hp=Math.max(1,p.hp-Math.floor(p.maxHp*.2));
        addLog("Thất bại trước "+enemy+". Hãy nâng cấp sức mạnh.");
    }

    save();
    render();
}

function fight(){
    battle("Yêu Thú",enemyPower(p.realm+p.stage),"combat");
}

function stageFight(){
    const n=p.currentStage;
    const multiplier=n%100===0?12:n%10===0?4:1;
    battle("Boss/Quái ải "+n,enemyPower(n)*multiplier,"stage");
}

function towerFight(){
    const n=p.tower;
    const multiplier=n%100===0?15:n%10===0?5:1;
    battle("Thủ vệ tầng "+n,enemyPower(n)*multiplier,"tower");
}

function toggleAuto(key){
    p[key]=!p[key];
    addLog((p[key]?"Bật ":"Tắt ")+key+".");
    save();
    render();
}

function upgradeRoot(){
    if(p.stones<500){alert("Không đủ Linh Thạch.");return;}
    if(p.root>=ROOTS.length-1){alert("Linh Căn đã đạt tối đa.");return;}

    p.stones-=500;
    p.root++;
    p.power=Math.floor(p.power*1.2);
    addLog("Nâng cấp Linh Căn thành "+ROOTS[p.root]);
    save();
    render();
}

function upgradeBody(){
    if(p.stones<500){alert("Không đủ Linh Thạch.");return;}
    if(p.body>=BODIES.length-1){alert("Thể Chất đã đạt tối đa.");return;}

    p.stones-=500;
    p.body++;
    p.maxHp=Math.floor(p.maxHp*1.25);
    p.hp=p.maxHp;
    p.defense=Math.floor(p.defense*1.2);
    addLog("Thể Chất tiến hóa thành "+BODIES[p.body]);
    save();
    render();
}

function upgradeManual(){
    if(p.stones<300){alert("Không đủ Linh Thạch.");return;}

    p.stones-=300;
    p.manuals++;
    p.power=Math.floor(p.power*1.15+20);
    addLog("Công pháp được nâng cấp.");
    save();
    render();
}

function buyPills(){
    if(p.stones<100){alert("Không đủ Linh Thạch.");return;}
    p.stones-=100;
    p.pills+=3;
    addLog("Mua 3 Tụ Khí Đan.");
    save();
    render();
}

function buyArtifact(){
    if(p.stones<1000){alert("Không đủ Linh Thạch.");return;}
    p.stones-=1000;
    p.artifacts++;
    p.power=Math.floor(p.power*1.25+100);
    addLog("Rèn một Pháp Bảo mới!");
    save();
    render();
}

function buyManual(){
    if(p.stones<500){alert("Không đủ Linh Thạch.");return;}
    p.stones-=500;
    p.manuals++;
    p.power+=200;
    addLog("Mua được bí kíp.");
    save();
    render();
}

function claimQuest(){
    let reward=0;

    if(p.quests.kills>=10){
        p.quests.kills-=10;
        reward+=500;
    }

    if(p.quests.cult>=20){
        p.quests.cult-=20;
        reward+=500;
    }

    if(p.quests.stages>=5){
        p.quests.stages-=5;
        reward+=1000;
    }

    if(reward===0){
        alert("Chưa hoàn thành nhiệm vụ.");
        return;
    }

    p.stones+=reward;
    addLog("Nhận thưởng nhiệm vụ: "+fmt(reward)+" Linh Thạch.");
    save();
    render();
}

function exportSave(){
    const blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="tu-tien-dai-dao-save.json";
    a.click();
    URL.revokeObjectURL(url);
}

function resetGame(){
    if(!confirm("Bạn có chắc muốn xóa tiến trình?"))return;
    localStorage.removeItem(saveKey);
    p=newPlayer(p.name);
    addLog("Đã tạo lại nhân vật.");
    save();
    render();
}

// Các hoạt động tự động trong lúc trang game đang mở.
let ticks=0;

setInterval(()=>{
    if(!p)return;

    ticks++;

    if(p.autoCult){
        p.cult+=offlineRate();
        p.quests.cult++;
        processBreakthroughs();
    }

    if(p.autoCombat&&ticks%3===0)fight();
    if(p.autoStages&&ticks%4===0)stageFight();
    if(p.autoTower&&ticks%5===0)towerFight();

    if(ticks%5===0){
        save();
        updateStatus();
    }
},1000);

window.addEventListener("beforeunload",save);
</script>
</body>
</html>
