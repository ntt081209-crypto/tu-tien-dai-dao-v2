<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b19">
<title>Tu Tiên Đại Đạo 3.0</title>

<style>
:root {
  --bg:#070916;
  --panel:rgba(12,18,38,.90);
  --gold:#ffd987;
  --cyan:#80e8ff;
  --purple:#c4a1ff;
  --text:#eef2ff;
  --muted:#aab4d1;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:system-ui,sans-serif;
  background:
    linear-gradient(#07091688,#070916f2),
    url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85")
    center/cover fixed;
}

button {
  padding:10px 13px;
  border:1px solid #c9aaff55;
  border-radius:10px;
  background:linear-gradient(135deg,#7653a7,#24466d);
  color:white;
  cursor:pointer;
  margin:3px;
}

button:active {
  transform:scale(.97);
}

input {
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ffffff22;
  border-radius:9px;
  background:#080d20;
  color:white;
}

header {
  position:sticky;
  top:0;
  z-index:5;
  padding:14px;
  background:#080b19eF;
  border-bottom:1px solid #ffffff20;
  backdrop-filter:blur(12px);
}

.brand {
  color:var(--gold);
  font-size:20px;
  font-weight:900;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.hero,.panel,.stat {
  background:var(--panel);
  border:1px solid #c5d5ff25;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 10px 35px #0004;
  backdrop-filter:blur(10px);
}

.hero {
  background:
    linear-gradient(100deg,#080d26eF,#111b3bb8),
    url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80")
    center/cover;
}

h1,h2 {
  color:var(--gold);
}

.stats {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.stat strong {
  display:block;
  color:var(--gold);
  font-size:18px;
}

.stat small {
  color:var(--muted);
}

.layout {
  display:grid;
  grid-template-columns:190px minmax(0,1fr);
  gap:12px;
}

.nav button {
  display:block;
  width:100%;
  text-align:left;
  background:#111a34;
}

.nav button.active {
  color:var(--gold);
  border-color:var(--gold);
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.card {
  padding:13px;
  border-radius:12px;
  border:1px solid #ffffff18;
  background:#111a34dd;
  margin-bottom:8px;
}

.progress {
  height:9px;
  background:#050817;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0;
}

.progress span {
  display:block;
  height:100%;
  background:linear-gradient(90deg,#55d8ff,#b79aff,#ffd987);
  transition:width .3s;
}

.gold {color:var(--gold)}
.muted {color:var(--muted)}
.hidden {display:none!important}

.cultivation-scene {
  height:130px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:
    radial-gradient(circle,#8f7cff40,transparent 60%),
    linear-gradient(#121a42,#080d20);
  overflow:hidden;
}

.cultivation-scene::after {
  content:"☯";
  color:var(--gold);
  font-size:65px;
  text-shadow:0 0 25px #bca2ff;
  animation:breathe 3s infinite ease-in-out;
}

.cloud {
  position:fixed;
  z-index:-1;
  pointer-events:none;
  width:40vw;
  height:100px;
  left:-45vw;
  border-radius:50%;
  background:radial-gradient(ellipse,#c2d8ff18,transparent 70%);
  filter:blur(12px);
  animation:cloudMove 60s linear infinite;
}

.cloud:nth-child(2) {
  top:35%;
  animation-duration:80s;
}

.cloud:nth-child(3) {
  top:65%;
  animation-duration:95s;
}

@keyframes cloudMove {
  to {transform:translateX(200vw)}
}

@keyframes breathe {
  50% {transform:scale(1.12);filter:brightness(1.5)}
}

@media(max-width:700px) {
  .layout {grid-template-columns:1fr}
  .nav {display:flex;overflow-x:auto;gap:5px}
  .nav button {width:auto;white-space:nowrap}
  .grid {grid-template-columns:1fr}
  .container {padding:9px}
}
</style>
</head>

<body>

<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<header>
  <div class="brand">☯ TU TIÊN ĐẠI ĐẠO 3.0</div>
  <small>TIÊN GIỚI HUYỀN ẢO</small>
</header>

<div class="container">

<div id="loginBox" class="panel">
  <h1>Tiên Môn Khai Mở</h1>
  <p>Nhập thông tin để bước vào tiên giới.</p>

  <label>Tên nhân vật</label>
  <input id="username" maxlength="24" placeholder="Tên đạo hữu">

  <label>Mật khẩu</label>
  <input id="password" type="password" placeholder="Mật khẩu">

  <button onclick="login()">Đăng nhập / Đăng ký</button>
</div>

<div id="game" class="hidden">

<section class="hero">
  <h1>Tiên Lộ Vô Cương</h1>
  <p>Phá cảnh nghịch thiên · Tu đạo trường sinh</p>
  <p>
    Cảnh giới: <b id="realm" class="gold"></b><br>
    Tầng: <b id="layer"></b> |
    Sức mạnh: <b id="power"></b>
  </p>
</section>

<div class="stats">
  <div class="stat">
    <small>✨ Tu vi</small>
    <strong id="xp"></strong>
    <div class="progress"><span id="xpBar"></span></div>
  </div>

  <div class="stat">
    <small>💎 Linh thạch</small>
    <strong id="stones"></strong>
  </div>

  <div class="stat">
    <small>❤️ Sinh lực</small>
    <strong id="hp"></strong>
    <div class="progress"><span id="hpBar"></span></div>
  </div>

  <div class="stat">
    <small>☁ Linh khí</small>
    <strong id="qi"></strong>
  </div>
</div>

<div class="layout">
  <nav class="nav panel" id="nav"></nav>
  <main id="view"></main>
</div>

</div>
</div>

<script>
/* ==========================================
   TU TIÊN ĐẠI ĐẠO 3.0
   PHẦN 2: HỆ THỐNG GAME CỐT LÕI
========================================== */

const REALMS = [
  "Phàm Nhân",
  "Luyện Khí",
  "Trúc Cơ",
  "Kim Đan",
  "Nguyên Anh",
  "Hóa Thần",
  "Luyện Hư",
  "Hợp Thể",
  "Đại Thừa",
  "Độ Kiếp",
  "Chân Tiên",
  "Kim Tiên",
  "Đại La Kim Tiên",
  "Tiên Quân",
  "Tiên Đế"
];

const NAVS = [
  ["home","🏯 Tổng quan"],
  ["cultivate","☯ Tu luyện"],
  ["battle","⚔ Chiến đấu"],
  ["character","🧙 Nhân vật"],
  ["inventory","🎒 Túi đồ"],
  ["quests","📜 Nhiệm vụ"],
  ["pets","🐉 Linh thú"],
  ["realm","🌌 Bí cảnh"],
  ["sect","🏮 Tông môn"],
  ["shop","🛒 Cửa hàng"],
  ["achievements","🏆 Thành tựu"],
  ["journal","📖 Nhật ký"],
  ["data","💾 Dữ liệu"]
];

function newPlayer(name) {
  return {
    user: name,
    realm: 0,
    layer: 1,
    xp: 0,
    qi: 0,
    stones: 100,
    hp: 100,
    maxHp: 100,
    basePower: 10,
    attack: 10,
    defense: 5,

    autoCultivate: false,
    autoBreak: false,
    autoFight: false,

    pet: null,
    petLevel: 1,
    sect: null,

    kills: 0,
    breaks: 0,
    cultivations: 0,
    expedition: 1,
    tower: 0,

    inventory: {
      "Tụ Khí Đan": 3,
      "Hồi Xuân Đan": 2
    },

    quests: {},
    logs: []
  };
}

let player = null;
let currentTab = "home";
let gameTimer = null;

function $(id) {
  return document.getElementById(id);
}

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function requiredXP() {
  return Math.floor(
    100 * Math.pow(1.48, player.layer - 1) *
    (1 + player.realm * 0.75)
  );
}

function getPower() {
  return player.basePower
    + player.realm * 30
    + (player.layer - 1) * 5
    + (player.pet ? player.petLevel * 12 : 0);
}

function record(message) {
  player.logs.unshift(
    new Date().toLocaleTimeString("vi-VN") +
    " · " + message
  );

  player.logs = player.logs.slice(0, 100);
}

function notify(message) {
  let old = $("gameNotice");

  if (!old) {
    old = document.createElement("div");
    old.id = "gameNotice";

    old.style.cssText =
      "position:fixed;bottom:18px;left:50%;" +
      "transform:translateX(-50%);z-index:999;" +
      "background:#101a34;border:1px solid #c4b1ff;" +
      "border-radius:12px;padding:12px 18px;" +
      "max-width:90%;text-align:center;color:white;";

    document.body.appendChild(old);
  }

  old.textContent = message;
  old.style.display = "block";

  clearTimeout(window.noticeTimer);

  window.noticeTimer = setTimeout(() => {
    old.style.display = "none";
  }, 2500);
}

/* ĐĂNG NHẬP VÀ LƯU DỮ LIỆU */

function login() {
  const name = $("username").value.trim();
  const password = $("password").value;

  if (!name || !password) {
    notify("Vui lòng nhập tên và mật khẩu.");
    return;
  }

  const accountKey = "ttdd_account_" + name;
  const saveKey = "ttdd_player_" + name;

  const oldPassword = localStorage.getItem(accountKey);

  if (oldPassword !== null && oldPassword !== password) {
    notify("Mật khẩu không chính xác.");
    return;
  }

  if (oldPassword === null) {
    localStorage.setItem(accountKey, password);
  }

  try {
    const saved = localStorage.getItem(saveKey);

    if (saved) {
      player = Object.assign(
        newPlayer(name),
        JSON.parse(saved)
      );
    } else {
      player = newPlayer(name);
      record("Đạo hữu lần đầu bước vào Tiên Giới.");
    }
  } catch (error) {
    player = newPlayer(name);
  }

  player.user = name;

  $("loginBox").classList.add("hidden");
  $("game").classList.remove("hidden");

  saveGame();
  startGame();
  renderGame();

  notify("Tiên Môn đã mở! Chúc đạo hữu tu luyện thành công.");
}

function saveGame() {
  if (!player) return;

  localStorage.setItem(
    "ttdd_player_" + player.user,
    JSON.stringify(player)
  );
}

function logout() {
  if (!player) return;

  saveGame();
  clearInterval(gameTimer);

  $("game").classList.add("hidden");
  $("loginBox").classList.remove("hidden");

  player = null;
}

function exportSave() {
  if (!player) return;

  const blob = new Blob(
    [JSON.stringify(player, null, 2)],
    {type: "application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "tu-tien-dai-dao-save.json";
  a.click();

  URL.revokeObjectURL(url);
}

function importSaveFile(file) {
  if (!player || !file) return;

  const reader = new FileReader();

  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);

      if (!data.user || data.user !== player.user) {
        notify("File lưu không thuộc nhân vật hiện tại.");
        return;
      }

      player = Object.assign(newPlayer(data.user), data);

      saveGame();
      renderGame();

      notify("Nhập dữ liệu thành công.");
    } catch (error) {
      notify("File dữ liệu không hợp lệ.");
    }
  };

  reader.readAsText(file);
}

/* CẬP NHẬT THÔNG SỐ */

function renderStats() {
  if (!player) return;

  const xpNeed = requiredXP();
  const realmName = REALMS[player.realm] || "Tiên Đế";

  $("realm").textContent = realmName;
  $("layer").textContent = player.layer + "/10";
  $("power").textContent = getPower();

  $("xp").textContent =
    Math.floor(player.xp).toLocaleString("vi-VN") +
    " / " + xpNeed.toLocaleString("vi-VN");

  $("stones").textContent =
    player.stones.toLocaleString("vi-VN");

  $("hp").textContent =
    player.hp + " / " + player.maxHp;

  $("qi").textContent =
    player.qi.toLocaleString("vi-VN");

  $("xpBar").style.width =
    Math.min(100, player.xp / xpNeed * 100) + "%";

  $("hpBar").style.width =
    Math.max(0, player.hp / player.maxHp * 100) + "%";
}

/* THANH ĐIỀU HƯỚNG */

function renderNav() {
  $("nav").innerHTML = NAVS.map(item => {
    const id = item[0];
    const label = item[1];

    return `
      <button
        class="${currentTab === id ? "active" : ""}"
        onclick="openTab('${id}')">
        ${label}
      </button>
    `;
  }).join("");
}

function openTab(tab) {
  currentTab = tab;

  renderNav();
  renderView();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* TU LUYỆN */

function cultivate() {
  if (!player) return;

  player.xp += 20;
  player.qi += 5;
  player.cultivations++;

  if (player.xp >= requiredXP()) {
    player.xp = requiredXP();

    notify("Tu vi viên mãn! Hãy thử đột phá.");
  } else {
    notify("Tu luyện thành công: +20 tu vi, +5 linh khí.");
  }

  record("Vận công tu luyện.");
  saveGame();
  renderGame();
}

function toggleAutoCultivation() {
  player.autoCultivate = !player.autoCultivate;

  notify(
    player.autoCultivate
      ? "Đã bật tự tu luyện."
      : "Đã tắt tự tu luyện."
  );

  record(
    player.autoCultivate
      ? "Bắt đầu treo máy tu luyện."
      : "Dừng treo máy tu luyện."
  );

  saveGame();
  renderGame();
}

function toggleAutoBreak() {
  player.autoBreak = !player.autoBreak;

  notify(
    player.autoBreak
      ? "Đã bật tự đột phá tầng."
      : "Đã tắt tự đột phá tầng."
  );

  saveGame();
  renderGame();
}

/* ĐỘT PHÁ TIỂU CẢNH GIỚI */

function breakthrough() {
  if (player.xp < requiredXP()) {
    notify("Tu vi chưa đủ, hãy tiếp tục tu luyện.");
    return;
  }

  if (player.layer < 10) {
    player.xp = 0;
    player.layer++;

    player.basePower += 5;
    player.maxHp += 10;
    player.hp = player.maxHp;

    player.breaks++;

    record("Đột phá thành công, tiến lên tầng " + player.layer + ".");

    notify("Đột phá thành công! Tầng " + player.layer);
  } else {
    showTribulation();
    return;
  }

  saveGame();
  renderGame();
}

/* THIÊN KIẾP VÀ ĐẠI CẢNH GIỚI */

function showTribulation() {
  const nextRealm = player.realm + 1;

  if (nextRealm >= REALMS.length) {
    notify("Bạn đã đạt cảnh giới cao nhất!");
    return;
  }

  const accepted = confirm(
    "Bạn đã đạt tầng 10.\n\n" +
    "Nghênh đón thiên kiếp để tiến vào " +
    REALMS[nextRealm] + "?"
  );

  if (!accepted) return;

  const chance = Math.min(
    0.95,
    0.55 + getPower() / 800 + player.defense / 300
  );

  document.body.animate(
    [
      {filter:"brightness(1)"},
      {filter:"brightness(2.2)"},
      {filter:"brightness(1)"}
    ],
    {duration:700}
  );

  if (Math.random() < chance) {
    player.realm++;
    player.layer = 1;
    player.xp = 0;

    player.basePower += 25;
    player.attack += 10;
    player.defense += 5;

    player.maxHp += 40;
    player.hp = player.maxHp;
    player.stones += 50;

    record("Thiên kiếp thành công! Đạt " + REALMS[player.realm] + ".");

    notify("Thiên kiếp thành công! " + REALMS[player.realm]);
  } else {
    player.hp = Math.max(1, player.hp - 35);
    player.stones = Math.max(0, player.stones - 20);

    record("Thiên kiếp thất bại.");

    notify("Thiên kiếp thất bại! Hãy củng cố đạo cơ.");
  }

  saveGame();
  renderGame();
}

/* CHIẾN ĐẤU */

function battle() {
  if (player.hp <= 0) {
    player.hp = Math.max(1, Math.floor(player.maxHp * 0.25));
    notify("Bạn được đưa về đạo trường để hồi phục.");
    saveGame();
    renderGame();
    return;
  }

  const enemyPower =
    8 + player.expedition * 12 +
    player.realm * 18 +
    Math.floor(Math.random() * 12);

  const myPower =
    player.attack + player.realm * 5 +
    player.layer * 2 + Math.floor(Math.random() * 10);

  if (myPower >= enemyPower * 0.65) {
    const reward = 12 + player.expedition * 3 +
      Math.floor(Math.random() * 12);

    player.stones += reward;
    player.xp = Math.min(
      requiredXP(),
      player.xp + 18
    );

    player.kills++;

    if (Math.random() < 0.18) {
      player.inventory["Tụ Khí Đan"] =
        (player.inventory["Tụ Khí Đan"] || 0) + 1;
    }

    record("Đánh bại yêu thú, nhận " + reward + " linh thạch.");

    notify("Chiến thắng! +" + reward + " linh thạch.");
  } else {
    const damage = Math.max(5, enemyPower - myPower);

    player.hp = Math.max(0, player.hp - damage);

    record("Bị yêu thú gây thương tích.");

    notify("Đối thủ quá mạnh! Mất " + damage + " sinh lực.");
  }

  saveGame();
  renderGame();
}

/* VƯỢT ẢI */

function clearStage() {
  if (player.hp < 20) {
    notify("Sinh lực quá thấp. Hãy hồi phục trước.");
    return;
  }

  const reward = 40 + player.expedition * 10;

  player.stones += reward;
  player.xp = Math.min(requiredXP(), player.xp + 30);
  player.expedition++;

  record("Vượt ải thành công, nhận " + reward + " linh thạch.");

  notify("Vượt ải thành công! +" + reward + " linh thạch.");

  saveGame();
  renderGame();
}

/* THÔNG THIÊN THÁP */

function climbTower() {
  if (player.hp < 25) {
    notify("Sinh lực không đủ để tiếp tục leo tháp.");
    return;
  }

  if (getPower() < player.tower * 18 + 20) {
    player.hp = Math.max(1, player.hp - 15);
    notify("Thất bại tại Thông Thiên Tháp! Mất 15 sinh lực.");
  } else {
    player.tower++;
    player.stones += 25;

    player.xp = Math.min(
      requiredXP(),
      player.xp + 25
    );

    notify("Vượt tầng " + player.tower + " thành công!");
  }

  record("Thử thách Thông Thiên Tháp.");

  saveGame();
  renderGame();
}

/* HỒI PHỤC */

function heal() {
  if (player.stones < 20) {
    notify("Không đủ 20 linh thạch.");
    return;
  }

  player.stones -= 20;
  player.hp = player.maxHp;

  record("Dùng linh thạch hồi phục sinh lực.");

  saveGame();
  renderGame();

  notify("Sinh lực đã hồi phục.");
}

/* HỆ THỐNG TỰ ĐỘNG */

function startGame() {
  clearInterval(gameTimer);

  gameTimer = setInterval(() => {
    if (!player) return;

    let changed = false;

    if (player.autoCultivate) {
      player.xp = Math.min(
        requiredXP(),
        player.xp + 20
      );

      player.qi += 5;
      player.cultivations++;

      changed = true;

      if (
        player.autoBreak &&
        player.layer < 10 &&
        player.xp >= requiredXP()
      ) {
        player.xp = 0;
        player.layer++;

        player.basePower += 5;
        player.maxHp += 10;
        player.hp = player.maxHp;

        player.breaks++;

        record("Tự động đột phá lên tầng " + player.layer + ".");
      }
    }

    if (player.autoFight && player.hp > 0) {
      const enemy =
        8 + player.expedition * 12 + player.realm * 18;

      const attack =
        player.attack + player.realm * 5 + player.layer * 2;

      if (attack >= enemy * 0.65) {
        player.stones += 10;
        player.kills++;
        player.xp = Math.min(requiredXP(), player.xp + 10);
      } else {
        player.hp = Math.max(0, player.hp - 3);
      }

      changed = true;
    }

    if (changed) {
      saveGame();
      renderStats();
    }
  }, 1000);
}
</script>

<script>
/* ======================================
   PHẦN 3: GIAO DIỆN VÀ HỆ THỐNG CÒN LẠI
====================================== */

  if (!player) return;
  renderStats();
  renderNav();
  renderView();

/* DÙNG VẬT PHẨM */

function useItem(name) {
  if (!player.inventory[name]) {
    notify("Bạn không còn vật phẩm này.");
    return;
  }

  if (name === "Tụ Khí Đan") {
    player.xp = Math.min(requiredXP(), player.xp + 80);
    player.qi += 20;
  } else if (name === "Hồi Xuân Đan") {
    player.hp = Math.min(player.maxHp, player.hp + 40);
  } else {
    notify("Vật phẩm này chưa thể sử dụng.");
    return;
  }

  player.inventory[name]--;

  if (player.inventory[name] <= 0) {
    delete player.inventory[name];
  }

  record("Sử dụng " + name + ".");
  saveGame();
  renderGame();
  notify("Đã sử dụng " + name);
}

/* LINH THÚ */

function getPet() {
  if (player.pet) {
    notify("Bạn đã có linh thú.");
    return;
  }

  if (player.stones < 150) {
    notify("Cần 150 linh thạch.");
    return;
  }

  player.stones -= 150;
  player.pet = ["Thanh Long","Bạch Hổ","Chu Tước","Huyền Vũ"][
    Math.floor(Math.random()*4)
  ];
  player.petLevel = 1;

  record("Kết duyên linh thú " + player.pet + ".");
  saveGame();
  renderGame();

  notify("Linh thú xuất hiện: " + player.pet + "!");
}

function feedPet() {
  if (!player.pet) {
    notify("Bạn chưa có linh thú.");
    return;
  }

  if (player.stones < 50) {
    notify("Không đủ linh thạch.");
    return;
  }

  player.stones -= 50;
  player.petLevel++;

  record("Nuôi dưỡng linh thú lên cấp " + player.petLevel + ".");
  saveGame();
  renderGame();

  notify("Linh thú đã tăng cấp!");
}

/* BÍ CẢNH */

function exploreRealm(requiredRealm,index) {
  if (player.realm < requiredRealm) {
    notify("Cảnh giới chưa đủ để vào bí cảnh này.");
    return;
  }

  const reward = 50 + index*40 + Math.floor(Math.random()*30);

  player.stones += reward;
  player.xp = Math.min(requiredXP(),player.xp+25+index*10);

  if (Math.random() < 0.3) {
    player.inventory["Tụ Khí Đan"] =
      (player.inventory["Tụ Khí Đan"] || 0) + 1;
  }

  record("Khám phá bí cảnh, nhận " + reward + " linh thạch.");
  saveGame();
  renderGame();

  notify("Khám phá thành công! +" + reward + " linh thạch.");
}

/* TÔNG MÔN */

function joinSect() {
  if (player.sect) {
    notify("Bạn đã gia nhập tông môn.");
    return;
  }

  if (player.stones < 100) {
    notify("Cần 100 linh thạch.");
    return;
  }

  player.stones -= 100;
  player.sect = "Thanh Vân Tông";

  record("Gia nhập Thanh Vân Tông.");
  saveGame();
  renderGame();

  notify("Chúc mừng, bạn đã gia nhập Thanh Vân Tông!");
}

function contributeSect() {
  if (!player.sect) {
    notify("Hãy gia nhập tông môn trước.");
    return;
  }

  if (player.stones < 30) {
    notify("Không đủ linh thạch.");
    return;
  }

  player.stones -= 30;
  player.basePower += 3;

  record("Cống hiến cho tông môn, tăng sức mạnh.");
  saveGame();
  renderGame();

  notify("Cống hiến thành công! Sức mạnh tăng.");
}

/* CỬA HÀNG */

function buyItem(name,price) {
  if (player.stones < price) {
    notify("Không đủ linh thạch.");
    return;
  }

  if (name === "Trứng Linh Thú" && player.pet) {
    notify("Bạn đã có linh thú.");
    return;
  }

  player.stones -= price;

  if (name === "Trứng Linh Thú") {
    player.pet = ["Thanh Long","Bạch Hổ","Chu Tước","Huyền Vũ"][
      Math.floor(Math.random()*4)
    ];
    player.petLevel = 1;
  } else {
    player.inventory[name] = (player.inventory[name] || 0) + 1;
  }

  record("Mua " + name + " tại Vạn Bảo Các.");
  saveGame();
  renderGame();

  notify("Mua thành công: " + name);
}

/* NHIỆM VỤ */

function claimQuest(key,goal,reward) {
  if (player.quests[key]) {
    notify("Bạn đã nhận thưởng nhiệm vụ này.");
    return;
  }

  const progress = {
    cultivate:player.cultivations,
    kills:player.kills,
    breaks:player.breaks
  }[key] || 0;

  if (progress < goal) {
    notify("Nhiệm vụ chưa hoàn thành.");
    return;
  }

  player.quests[key] = true;
  player.stones += reward;

  record("Hoàn thành nhiệm vụ, nhận " + reward + " linh thạch.");
  saveGame();
  renderGame();

  notify("Nhiệm vụ hoàn thành! +" + reward + " linh thạch.");
}

/* KHỞI ĐỘNG */
renderNav();
